<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off
LimitRequestBody 16384
# Native model memory is per PHP process. Keep worker count small.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 300
</IfModule>
