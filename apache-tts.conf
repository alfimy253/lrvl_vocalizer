<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
    # Apache normally strips Authorization before handing the request to PHP,
    # which makes every Bearer token look absent and every call return 401.
    # Requires Apache 2.4.13+ (the php:8.4-apache-bookworm image ships 2.4.62).
    CGIPassAuth On
</Directory>
ServerTokens Prod
ServerSignature Off
LimitRequestBody 16384
# Native model memory is per PHP process. Keep worker count small.
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 300
</IfModule>
